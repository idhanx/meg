services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn meg.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: [falkordb]
  ui:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./ui:/app"]
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    depends_on: [api]
